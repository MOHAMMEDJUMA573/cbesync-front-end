<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CbeSync-Auth</title>
    <!--Box icons-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="top-level-box">
        <!--User login form-->
        <div class="main-box login">
            <form action="http://127.0.0.1:80/post" method="post">
                <!--Form heading-->
                <h1>Login</h1>
                <!--email input-->
                <div class="input-box">
                    <input type="email" name="user-email" id="user-email" placeholder="e.g example@email.com" required>
                    <i class='bx bxs-user-circle'></i>
                </div>
                <!--Password input-->
                <div class="input-box">
                    <input type="password" name="user-password" id="user-password" placeholder="password" required>
                    <i class='bx bxs-lock-alt' ></i>
                </div>
                <!--Forgot p box-->
                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>
                <!--Submit btn-->
                <button type="submit" class="btn">Login</button>
                <!--Social divs-->
                <p>or login with social platforms</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-google' ></i></a>
                    <a href="#"><i class='bx bxl-github' ></i></a>
                    <a href="#"><i class='bx bxl-meta' ></i></a>
                    <a href="#"><i class='bx bxs-face' ></i></a>
                </div>
            </form>
        </div>
        <!--School form-->
        <div class="main-box register">
            <form action="http://127.0.0.1:80/post" method="post">
                <!--Form heading-->
                <h1>Register</h1>
                <!--Username input-->
                <div class="input-box">
                    <input type="text" name="school-name" id="school-name" placeholder="School name" required>
                    <i class='bx bxs-rename'></i>
                </div>
                <div class="input-box">
                    <input type="text" name="school-code" id="school-code" placeholder="School code" required>
                    <i class='bx bx-code' ></i>
                </div>
                <!--School email-->
                <div class="input-box">
                    <input type="email" name="school-email" id="school-email" placeholder="School email" required>
                    <i class='bx bxs-envelope' ></i>
                </div>
                <!--Password input-->
                <div class="input-box">
                    <input type="password" name="school-password1" id="school-password1" placeholder="password" required>
                    <i class='bx bxs-lock-alt' ></i>
                </div>
                <div class="input-box">
                    <input type="password" name="school-password2" id="school-password2" placeholder="confirm password" required>
                    <i class='bx bxs-lock-alt' ></i>
                </div>
                <!--Submit btn-->
                <button type="submit" class="btn">Register</button>               
            </form>
        </div>
        <!--side box-->
        <div class="side-box">
            <div class="side-panel side-left">
                <h1>Welcome back!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>
            <div class="side-panel side-right">
                <h1>School Registration</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
